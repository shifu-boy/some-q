<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>some-q — Grade 7 Revision Quiz</title>
<style>
:root{--bg:#0b0b12;--card:#14141f;--elev:#1c1c2a;--border:#2a2a3d;--text:#e8e8f0;--muted:#8b8ba3;--primary:#6366f1;--good:#10b981;--bad:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.logo{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
h1{font-size:1.35rem}
.sub{color:var(--muted);font-size:0.85rem;margin-bottom:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--text);text-align:left}
.tab small{color:var(--muted);display:block;font-size:0.72rem}
.tab.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.bar{display:flex;align-items:center;gap:10px;font-size:0.8rem;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.progress{flex:1;min-width:120px;height:8px;background:var(--elev);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width .25s}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.topic{font-size:0.72rem;color:var(--primary);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.q{font-size:1.08rem;line-height:1.55;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--elev);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:0.95rem;color:var(--text);text-align:left;width:100%}
.opt .k{font-weight:800;color:var(--muted);flex:0 0 auto}
.opt:not(.lock):hover{border-color:var(--primary)}
.opt.lock{cursor:default}
.opt.right{border-color:var(--good);background:rgba(16,185,129,.12)}
.opt.right .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.12)}
.opt.wrong .k{color:var(--bad)}
.opt.dim{opacity:.55}
.explain{display:none;margin-top:14px;padding:12px 14px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.3);border-radius:10px;font-size:0.87rem;line-height:1.55}
.explain.show{display:block}
.explain b{color:var(--primary)}
.nav{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;background:var(--elev);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;cursor:pointer;font-size:0.9rem}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.row label{font-size:0.8rem;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.done{text-align:center;padding:32px 12px}
.done h2{font-size:1.5rem;margin-bottom:8px}
.done p{color:var(--muted);margin-bottom:18px}
footer{margin-top:28px;text-align:center;font-size:0.75rem;color:var(--muted)}
footer a{color:var(--primary)}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">◆</div><h1>some-q</h1></header>
  <p class="sub">Grade 7 revision — English · Integrated Science · Mathematics. Pick an answer, learn instantly.</p>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <span id="pos">0 / 0</span>
    <div class="progress"><i id="pfill"></i></div>
    <span id="score">Score 0</span>
    <span id="best"></span>
  </div>
  <div class="card">
    <div class="topic" id="topic"></div>
    <div class="q" id="q">Loading questions…</div>
    <div class="opts" id="opts"></div>
    <div class="explain" id="explain"></div>
    <div class="nav">
      <button class="btn" id="prev">← Prev</button>
      <button class="btn primary" id="next">Next →</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="shuffle" checked> Shuffle</label>
      <button class="btn" id="restart" style="flex:0 0 auto;padding:8px 14px">Restart</button>
    </div>
  </div>
  <footer>some-q · G7 revision kit · <a href="https://github.com/shifu-boy/some-q">GitHub</a></footer>
</div>
<script src="./app.js"></script>
</body>
</html>
